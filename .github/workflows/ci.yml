name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check schema and RLS in disposable PostgreSQL
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/postgres-bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/001_init_schema.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/002_members_only.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/003_project_discussions.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/004_agent_contacts.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/005_member_management.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/006_public_events.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/007_event_checkin.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/checkin.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/rls.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/discussions.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/contacts.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/members.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/public-events.sql
          PGHOST=localhost PGUSER=postgres PGDATABASE=postgres bash tests/public-events-concurrency.sh
          PGHOST=localhost PGUSER=postgres PGDATABASE=postgres bash tests/checkin-concurrency.sh
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/migration008-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/008_registration_review.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/migration008-legacy.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/application.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/009_event_agenda.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/photo-storage-bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/010_event_photos.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/event-photos.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/011_event_photo_lifecycle.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/event-photo-lifecycle.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/photo-cleanup-fairness.sql
          PGHOST=localhost PGUSER=postgres PGDATABASE=postgres bash tests/event-photo-lifecycle-concurrency.sh
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/012_guest_registration.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/guest-registration.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/013_feature_flags.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/feature-flags.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/017_polls.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/polls.sql
          PGHOST=localhost PGUSER=postgres PGDATABASE=postgres bash tests/polls-concurrency.sh
          PGHOST=localhost PGUSER=postgres PGDATABASE=postgres node --import tsx tests/event-http-e2e.ts
      - run: npm audit --audit-level=high
